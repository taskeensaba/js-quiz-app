
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. The Welcome Screen (Has the start button) -->
    <div id="start-screen">
        <h1>Are you ready for the Quiz?</h1>
        <button id="btn">Start Quiz</button>
    </div>

    <!-- 2. The Quiz Container (Stays empty until you click start) -->
    <div id="quiz-container" class="hidden"></div>

    <!-- script.js loaded with defer so it waits for HTML to load -->
    <script src="script.js" defer></script>
    
</body>
</html>
